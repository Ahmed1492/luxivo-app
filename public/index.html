<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- 
      %PUBLIC_URL% => this variable store path of public file
      -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff5722'/><text y='.9em' font-size='80' x='10'>🛍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff5722" />
    <meta name="description" content="Luxivo — Your one-stop destination for the best deals across every category. Shop smart, live luxe." />
    <!-- 
    this meta will make icon to display only  on apple 
      -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- 
    PWD => Progressive Web Application this techniqe to convert your web application to mobile application
    - is a JSON file that contains metadata about your web application, specifying how you want it to appear and 
    behave
    when accessed on mobile devices.
      -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"

    />
